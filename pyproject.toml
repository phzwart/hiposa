[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hiposa"
version = "0.1.0"
description = "Hierarchical Poisson Sampling - A library for generating hierarchical Poisson disk sampling patterns with symmetry support"
readme = "README.md"
authors = [
   {name = "Petrus Zwart", email = "PHZwart@lbl.gov"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["sampling", "poisson", "hierarchical", "tiling", "symmetry", "optimization"]
dependencies = [
    "numpy>=1.17.0",
    "scipy>=1.3.0",
    "matplotlib>=3.0.0",
    "scikit-learn>=0.24.0",
]
requires-python = ">=3.8"

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
    "isort>=5.0",
    "pre-commit>=2.0",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
    "numpydoc>=1.0",
]
examples = [
    "jupyter>=1.0",
    "ipywidgets>=7.0",
    "seaborn>=0.11.0",
]

[project.urls]
"Homepage" = "https://github.com/phzwart/hiposa"
"Documentation" = "https://hiposa.readthedocs.io"
"Bug Tracker" = "https://github.com/phzwart/hiposa/issues"
"Source Code" = "https://github.com/phzwart/hiposa"

[tool.setuptools]
packages = ["hiposa"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=hiposa",
    "--cov-report=term-missing",
    "--cov-report=html",
]
